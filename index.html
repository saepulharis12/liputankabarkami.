    const m = chunk.match(re);
    if(!m) return '';
    let rest = chunk.slice(m.index + m[0].length).replace(/^[ \t]+/,'');
    const q = rest.charAt(0);
    if(q === '`' || q === '"' || q === "'"){
      const close = rest.indexOf(q, 1);
      if(close !== -1) return rest.slice(1, close).trim();
      /* nilai tidak ditutup → selamatkan sampai sebelum penutup objek */
      let v = rest.slice(1);
      v = v.replace(/[{}\[\];,\s]+$/g, '');
      return v.trim();
    }
    const nl = rest.search(/[\n\r}]/);
    return (nl === -1 ? rest : rest.slice(0, nl)).trim();
  }catch(e){ return ''; }
}
function parseBeritaToleran(raw){
  try{
    if(!raw) return [];
    const items = [];
    const re = /judul\s*[:=]/gi;
    const pos = [];
    let m;
    while((m = re.exec(raw)) !== null){ pos.push(m.index); }
    for(let p=0;p<pos.length;p++){
      const chunk = raw.slice(pos[p], p+1<pos.length ? pos[p+1] : raw.length);
      const it = {
        judul: bacaField(chunk,'judul'),
        tanggal: bacaField(chunk,'tanggal'),
        kategori: bacaField(chunk,'kategori'),
        foto: bacaField(chunk,'foto'),
        isi: bacaField(chunk,'isi')
      };
      if(it.judul) items.push(it);
    }
    return items;
  }catch(e){ return []; }
}

function matchTopic(title, deck, category){

function pickTopicPhoto(title, deck, category, seed){
  const topic = matchTopic(title, deck, category);

  let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; }
  return pool[h % pool.length];
}

function parseTanggalIndo(str){
  if(!str) return new Date().toISOString();
  const m = String(str).trim().match(/^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})$/);
  if(m && BULAN_INDO[m[2].toLowerCase()]!==undefined){
    const d = new Date(Number(m[3]), BULAN_INDO[m[2].toLowerCase()], Number(m[1]), 8, 0);
    if(!isNaN(d)) return d.toISOString();
  }
  const d = new Date(str);
  return isNaN(d) ? new Date().toISOString() : d.toISOString();
}

function detectRegionAndCategory(title,content){
  const text = (title+' '+(content||'')).toLowerCase();
  const rules = [
    ['Politik',['politik','pemilu','pilkada','dpr','presiden','partai','kpu','bawaslu']],
    ['Ekonomi',['ekonomi','bisnis','investasi','rupiah','pasar','perbankan','umkm']],
    ['Teknologi',['teknologi','digital','internet','aplikasi','ai','startup']],
    ['Hukum',['hukum','pengadilan','polisi','kejaksaan','kasus','tersangka','pidana']],
    ['Pendidikan',['pendidikan','sekolah','kampus','guru','siswa','universitas']],
    ['Kesehatan',['kesehatan','rumah sakit','dokter','obat','penyakit']],
    ['Olahraga',['olahraga','sepak bola','bola','badminton','basket','atlet']],
    ['Gaya Hidup',['gaya hidup','kuliner','wisata','fashion','hiburan']],
    ['Lingkungan',['lingkungan','banjir','sampah','hutan','cuaca','iklim']]
  ];
  let category='Nasional';
  for(const [cat,words] of rules){ if(words.some(w=>text.includes(w))){category=cat;break;} }
  for(const [isl,provinces] of Object.entries(INDONESIA_ISLANDS)){
    for(const p of provinces){ if(text.includes(p.toLowerCase())) return {prov:p,island:isl,category}; }
  }
  const aliases=[
    ['Tangerang','Banten','Jawa'],['Serang','Banten','Jawa'],['Pandeglang','Banten','Jawa'],
    ['Lebak','Banten','Jawa'],['Bandung','Jawa Barat','Jawa'],['Bekasi','Jawa Barat','Jawa'],
    ['Bogor','Jawa Barat','Jawa'],['Depok','Jawa Barat','Jawa'],['Semarang','Jawa Tengah','Jawa'],
    ['Surabaya','Jawa Timur','Jawa'],['Yogyakarta','DI Yogyakarta','Jawa'],['Jakarta','DKI Jakarta','Jawa'],
    ['Medan','Sumatera Utara','Sumatra'],['Makassar','Sulawesi Selatan','Sulawesi'],['Denpasar','Bali','Bali & Nusa Tenggara'],
    ['Gunung Sari','Banten','Jawa'],['Mauk','Banten','Jawa']
  ];
  for(const [city,p,isl] of aliases){ if(text.includes(city.toLowerCase())) return {prov:p,island:isl,kota:city,category}; }
  return {prov:'Nasional',island:'Nasional',category};
}

function hashStr(s){ let h=0; const t=String(s); for(let i=0;i<t.length;i++){ h=(h*31+t.charCodeAt(i))>>>0; } return h; }

function extractImage(item){
  if(item.thumbnail) return item.thumbnail;
  if(item.enclosure && item.enclosure.link && /\.(jpg|jpeg|png|webp|gif)/i.test(item.enclosure.link)) return item.enclosure.link;
  const html = (item.content||'') + ' ' + (item.description||'');
  const m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
  if(m && m[1].indexOf('news.google.com')===-1) return m[1];
  const m2 = html.match(/https?:\/\/[^\s"'<>]+\.(?:jpg|jpeg|png|webp)/i);
  if(m2 && m2[0].indexOf('news.google.com')===-1) return m2[0];
  return '';
}

function baseStats(id){
  const h = hashStr(id);
  const views = 900 + (h % 15000);
  const likes = Math.max(12, Math.floor(views * (0.018 + ((h>>3) % 40)/1000)));
  const comments = 2 + ((h>>6) % 35);
  const shares = Math.max(4, Math.floor(likes * 0.25));
  return {views, likes, comments, shares};
}

const DEFAULT_ARTICLES = [...SEED_ARTICLES, ...INITIAL_ARTICLES];

/* ===== STORAGE v19 ===== */
const STORAGE = { articles:'inw_v19_articles', real:'inw_v19_real', bookmarks:'inw_v19_bookmarks', notifications:'inw_v19_notif', likes:'inw_v19_likes', engagement:'inw_v19_engagement', seedSync:'inw_v19_seedsync' };
function loadStorage(key,fallback){
  try{ const c=localStorage.getItem(key); if(c) return JSON.parse(c); }catch(e){}
  return fallback;
}
function saveStorage(key,value){ try{ localStorage.setItem(key,JSON.stringify(value)); }catch(e){} }
function safeGetSession(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
function safeSetSession(k,v){ try{ if(v) sessionStorage.setItem(k,v); else sessionStorage.removeItem(k); }catch(e){} }

function syncSeedsWithStorage(){
  const stored = loadStorage(STORAGE.articles, null);
  if(!stored || !Array.isArray(stored) || !stored.length){
    saveStorage(STORAGE.seedSync, SEED_FINGERPRINT);
    return { list: DEFAULT_ARTICLES, added: 0 };
  }
  const prevFp = loadStorage(STORAGE.seedSync, null);
  const fpChanged = prevFp !== SEED_FINGERPRINT;
  let list = stored.slice();
  let added = 0;
  SEED_ARTICLES.forEach(seed => {
    const idx = list.findIndex(a => a.id === seed.id);
    if(idx === -1){ list.push(seed); added++; }
    else if(fpChanged){
      list[idx] = Object.assign({}, list[idx], {
        title:seed.title, slug:seed.slug, deck:seed.deck, content:seed.content,
        keyTakeaways:seed.keyTakeaways, category:seed.category, tags:seed.tags,
        prov:seed.prov, kota:seed.kota, pulau:seed.pulau,
        publishedAt:seed.publishedAt, readingTime:seed.readingTime, image:seed.image
      });
    }
  });
  list = list.filter(a => !(a.id && String(a.id).indexOf('seed-')===0 && !SEED_IDS.has(a.id)));
  saveStorage(STORAGE.seedSync, SEED_FINGERPRINT);
  return { list, added };
}

function SafeImg(props){
  const chain = [...new Set([props.src, props.fallback, props.net].filter(Boolean))];
  if(!chain.length) return null;
  return (
    <img src={chain[0]} alt={props.alt||''} loading="lazy"
      referrerPolicy="no-referrer"
      className={props.className}
      onError={e=>{
        const t=e.currentTarget;
        const i = Number(t.dataset.i||0) + 1;
        if(i < chain.length && chain[i] !== t.getAttribute('src')){
          t.dataset.i = String(i);
          t.src = chain[i];
        } else { t.style.display='none'; }
      }} />
  );
}
function AnimatedLogo({ src, fallback, className }) {
  return (
    <span className={"logo-anim "+(className||'')}>
      <SafeImg src={src} fallback={fallback} net={LOGO_DARURAT}
        alt={SITE_NAME} className="h-full w-auto max-w-none object-contain object-left" />
    </span>
  );
}
function ArticleImg({ article, className }) {
  const topic = article._topicImg
    || pickTopicPhoto(article.title, article.deck, article.category, article.id);
  return (
    <SafeImg src={article.image} fallback={topic} net={netPhoto(article.id||article.title)}
      alt={article.title} className={className} />
  );
}

class Boundary extends React.Component {
  constructor(p){ super(p); this.state={err:null}; }
  static getDerivedStateFromError(e){ return {err:e}; }
  render(){
    if(this.state.err){
      return (
        <div style={{padding:40,fontFamily:'Arial'}}>
          <h2 style={{fontWeight:800,fontSize:22}}>Terjadi kesalahan pada aplikasi.</h2>
          <pre style={{whiteSpace:'pre-wrap',color:'#b91c1c',fontSize:13}}>{String(this.state.err && this.state.err.message || this.state.err)}</pre>
          <button onClick={()=>{try{Object.values(STORAGE).forEach(k=>localStorage.removeItem(k));}catch(e){} location.reload();}}
            style={{background:'#1c1917',color:'#fff',padding:'10px 18px',borderRadius:10,border:'none',fontWeight:700,cursor:'pointer'}}>
            Reset Data &amp; Muat Ulang
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

function ArticleBody({ content, fontSize }) {
  const paras = String(content||'').split(/\n{2,}/).map(p=>p.trim()).filter(Boolean);
  if(!paras.length) return null;
  return (
    <div className="space-y-5 font-serif leading-relaxed text-stone-800">
      {paras.map((p,i)=>(
        <p key={i} className={i===0?'dropcap':''} style={{fontSize:fontSize+'px', whiteSpace:'pre-line'}}>{p}</p>
      ))}
    </div>
  );
}

  async function fetchFeed(feed){
    try{
      const res = await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feed.url));
      const data = await res.json();
      if(!data || data.status!=='ok' || !data.items || !data.items.length) return [];
      return data.items.map((item,i)=>{
        const rawTitle = stripHtml(item.title||'');
        let title=rawTitle, source='';
        const dashIdx = rawTitle.lastIndexOf(' - ');
        if(dashIdx>15){ source=rawTitle.slice(dashIdx+3); title=rawTitle.slice(0,dashIdx); }
        if(!source) source=feed.name;
        const fullRaw = stripHtml(item.content||'');
        const descRaw = stripHtml(item.description||'');
        const desc = fullRaw.length > descRaw.length ? fullRaw : descRaw;
        const det = detectRegionAndCategory(title,desc);
        const d = item.pubDate ? new Date(item.pubDate) : new Date();
        const id = hashId(item.guid||item.link||title);
        const srcImg = extractImage(item);
        const topicImg = pickTopicPhoto(title, desc, det.category, id);
        return {
          id:id, title:title,
          deck:desc.slice(0,220)||title,
          content:desc||title,
          keyTakeaways:[],
          category:det.category, tags:[source],
          prov:det.prov, kota:det.kota||'', pulau:det.island,
          author:source,
          publishedAt:isNaN(d)?new Date().toISOString():d.toISOString(),
          readingTime:Math.max(1,Math.ceil((desc||title).split(/\s+/).length/180)),
          image:srcImg || topicImg,
          _topicImg:topicImg,
          views:0, likes:0, isLead:false, isBreaking:false,
          external:true, link:item.link
        };
      }).filter(a=>a.title);
    }catch(e){ return []; }
  }

    const h = (window.location.hash||'').toLowerCase();
    let key = (h && h.length>=2) ? h.slice(1) : '';
    if(!key){
      try{ key = (new URLSearchParams(window.location.search||'').get('berita')||'').toLowerCase(); }catch(e){}
    }
    if(!key) return;
    const found = allArticles.find(a=>
      (a.id||'').toLowerCase()===key ||
      (a.slug||'').toLowerCase()===key ||
      (a.title||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')===key
    );
    if(found) openArticle(found);
  },[allArticles]);
  function toggleBookmark(id){
    setBookmarks(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]);
  }
  function toggleLike(id){
    const has=likedIds.includes(id);
    setLikedIds(prev=>has?prev.filter(x=>x!==id):[...prev,id]);
    setEngagement(prev=>{
      const cur = prev[id]||{};
      return Object.assign({}, prev, {
        [id]: Object.assign({}, cur, { likes: Math.max(0,(cur.likes||0)+(has?-1:1)) })
      });
    });
  }
  function addComment(id,text){
    if(!text.trim()) return;
    const comment={id:Date.now(),name:SITE_READER,text:text.trim(),createdAt:new Date().toISOString()};
    setEngagement(prev=>{
      const cur = prev[id]||{};
      return Object.assign({}, prev, {
        [id]: Object.assign({}, cur, { comments:[...(cur.comments||[]), comment] })
      });
    });
    setCommentText('');
  }
  function countShare(id){
    setEngagement(prev=>{
      const cur = prev[id]||{};
      return Object.assign({}, prev, {
        [id]: Object.assign({}, cur, { shares:(cur.shares||0)+1 })
      });
    });
  }
  function speakArticle(article){
    if(!('speechSynthesis' in window)){ alert('Browser belum mendukung fitur baca berita.'); return; }
    window.speechSynthesis.cancel();
    if(isReading){ setIsReading(false); return; }
    const u=new SpeechSynthesisUtterance(article.title+'. '+(article.deck||'')+'. '+(article.content||''));
    u.lang='id-ID'; u.rate=.95;
    u.onend=()=>setIsReading(false);
    u.onerror=()=>setIsReading(false);
    setIsReading(true);
    window.speechSynthesis.speak(u);
  }
    function shareArticle(article){
    countShare(article.id);
    const key = article.slug || article.id;
    const base = window.location.href.split('#')[0].split('?')[0];
    /* &v=2 = pemicu cache: membuat WhatsApp/Facebook mengambil meta TERBARU
       (foto pratinjau baru) alih-alih memakai pratinjau lama yang tersimpan */
    const url = base + '?berita=' + encodeURIComponent(key) + '&v=2#' + key;
    const text = article.title+'\n'+(article.deck||'');
    if(navigator.share){ navigator.share({title:article.title,text:text,url:url}).catch(()=>{}); }
    else if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text+'\n'+url).then(()=>alert('Link berita berhasil disalin!')).catch(()=>alert(url));
    } else alert(url);
  }

    const det=detectRegionAndCategory(adminForm.title,adminForm.content);
    const existing=adminForm.id?localArticles.find(a=>a.id===adminForm.id):null;
    const data={
      id:adminForm.id||('art-'+Date.now()),
      title:adminForm.title.trim(),
      slug:adminForm.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''),
      deck:adminForm.deck.trim()||adminForm.content.trim().slice(0,140),
      content:adminForm.content.trim(),

      category:adminForm.category||det.category,

            </div>
          </aside>
        </section>
      </main>

      {/* FOOTER — LOGO ANIMASI */}
      <footer className="bg-stone-950 text-white mt-8">
        <div className="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-10 grid sm:grid-cols-2 lg:grid-cols-4 gap-8">
          <div className="sm:col-span-2">
            <AnimatedLogo src={LOCAL_ASSETS.logoFooter} fallback={LOCAL_ASSETS.logoUtama}
              className="h-20 sm:h-24 max-w-full" />
            <p className="text-stone-400 text-sm leading-relaxed mt-4 max-w-xl">
              Portal berita Indonesia yang menyajikan informasi aktual dari berbagai daerah dengan mengedepankan ketelitian, keberimbangan dan keterbukaan informasi.
            </p>
          </div>
          <div>
            <h4 className="font-bold text-sm mb-3">Navigasi</h4>
            <div className="space-y-2 text-xs text-stone-400">
              {CATEGORIES.slice(1,7).map(c=>(
                <button key={c} onClick={()=>{setActiveCategory(c);window.scrollTo({top:0,behavior:'smooth'});}} className="block hover:text-white">{c}</button>
              ))}
            </div>
          </div>
          <div>
            <h4 className="font-bold text-sm mb-3">Redaksi</h4>
            <div className="space-y-2 text-xs text-stone-400">
              <div>{SITE_AUTHOR}</div>
              <div>Pedoman Media Siber</div>
              <div>Kode Etik Jurnalistik</div>
              <div>Hak Cipta</div>
            </div>
          </div>
        </div>
        <div className="border-t border-stone-800">
          <div className="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 text-[10px] text-stone-500">
            © {new Date().getFullYear()} {SITE_NAME}. Seluruh hak cipta dilindungi. <span className="ml-2 text-stone-600">saepul haris</span>
          </div>
        </div>
      </footer>

      {/* ===== HALAMAN ARTIKEL PENUH ===== */}
      {selectedArticle && (
        <div id="article-page" className="fixed inset-0 z-[100] bg-white overflow-y-auto">
          <div className="sticky top-0 z-10 bg-white/95 backdrop-blur border-b border-stone-200">
            <div className="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
              <button onClick={closeReader} className="flex items-center gap-2 text-sm font-bold hover:text-red-700 shrink-0">
                <span className="text-lg">←</span> Kembali
              </button>
              <AnimatedLogo src={LOCAL_ASSETS.logoUtama} fallback={LOCAL_ASSETS.logo}
                className="h-10 sm:h-12 max-w-[42vw] mx-2" />
              <div className="flex items-center gap-1 shrink-0">
                <button onClick={()=>shareArticle(selectedArticle)} className="px-2.5 py-2 rounded-lg border text-xs" title="Bagikan">↗</button>
                <button onClick={()=>speakArticle(selectedArticle)} className="px-2.5 py-2 rounded-lg border text-xs" title="Dengarkan">{isReading?'⏹':'🔊'}</button>
                <button onClick={()=>toggleBookmark(selectedArticle.id)} className="px-2.5 py-2 rounded-lg border text-xs" title="Simpan">{bookmarks.includes(selectedArticle.id)?'🔖':'📑'}</button>
              </div>
            </div>
          </div>

          <div className="max-w-3xl mx-auto px-4 py-6 sm:py-10 pb-24">
            <div className="flex flex-wrap items-center gap-2 text-[11px] font-black uppercase tracking-wider">
              <span className="text-red-700">{selectedArticle.category}</span>
              <span className="text-stone-300">/</span>
              <span className="text-stone-500">{selectedArticle.prov}</span>
              {selectedArticle.external && <span className="px-2 py-0.5 rounded bg-red-600 text-white normal-case">{selectedArticle.author}</span>}
            </div>

            <h1 className="font-serif text-3xl sm:text-5xl font-black leading-tight break-anywhere mt-3">
              {selectedArticle.title}
            </h1>
            <p className="mt-4 text-lg text-stone-600 leading-relaxed font-serif">{selectedArticle.deck}</p>

            <div className="mt-6 flex items-center gap-3 border-b border-stone-200 pb-5">
              <div className="w-10 h-10 rounded-full bg-stone-900 text-white flex items-center justify-center font-black text-sm shrink-0">
                {(selectedArticle.author||'R').charAt(0).toUpperCase()}
              </div>
              <div className="min-w-0">
                <div className="text-sm font-bold break-anywhere">{selectedArticle.author}</div>
                <div className="text-[11px] text-stone-400">Tim Redaksi • {selectedArticle.readingTime} menit baca</div>
              </div>
              <button onClick={()=>setFontSize(x=>Math.min(25,x+1))} className="ml-auto px-2.5 py-1.5 rounded-lg border text-xs font-bold" title="Perbesar teks">A+</button>
              <button onClick={()=>setFontSize(x=>Math.max(15,x-1))} className="px-2.5 py-1.5 rounded-lg border text-xs font-bold" title="Perkecil teks">A−</button>
            </div>

            <figure className="mt-6">
              <div className="rounded-2xl overflow-hidden bg-stone-100">
                <ArticleImg article={selectedArticle} className="w-full max-h-[480px] object-cover" />
              </div>
              <figcaption className="mt-2 text-[11px] text-stone-400">
                Foto: {selectedArticle.external ? selectedArticle.author+' (sumber asli)' : SITE_AUTHOR}
              </figcaption>
            </figure>

            <div className="mt-5 flex flex-wrap gap-3 text-[11px] text-stone-500 font-bold">
              <span>👁 {formatViews(selStats.views)} dibaca</span>
              <span>♥ {formatViews(selStats.likes)} suka</span>
              <span>💬 {selComments.length} komentar</span>
              <span>↗ {formatViews(selStats.shares)} dibagikan</span>
            </div>

            {selectedArticle.external && (
              <a href={selectedArticle.link} target="_blank" rel="noreferrer"
                className="mt-6 flex items-center justify-between bg-stone-900 text-white rounded-xl px-4 py-3 text-xs font-bold hover:bg-stone-700">
                <span>Baca versi lengkap di {selectedArticle.author} ↗</span>
                <span>→</span>
              </a>
            )}

            {(selectedArticle.keyTakeaways||[]).length>0 && (
              <div className="mt-7 p-4 sm:p-5 rounded-2xl bg-[#EEE9DF]">
                <div className="text-[10px] uppercase tracking-widest font-black mb-2">Poin Utama</div>
                <ul className="space-y-2 text-sm">
                  {selectedArticle.keyTakeaways.map((x,i)=><li key={i}>• {x}</li>)}
                </ul>
              </div>
            )}

            <div className="mt-8">
              <ArticleBody content={selectedArticle.content} fontSize={fontSize} />
            </div>

            <div className="flex flex-wrap gap-2 mt-8 pt-6 border-t border-stone-200">
              {(selectedArticle.tags||[]).map(tag=>(
                <button key={tag} onClick={()=>{setSelectedTag(tag);closeReader();}} className="px-3 py-1.5 rounded-full bg-stone-100 border text-[11px] font-bold hover:border-stone-500">#{tag}</button>
              ))}
            </div>

            <div className="flex flex-wrap items-center gap-2 mt-5">
              <button onClick={()=>toggleLike(selectedArticle.id)}
                className={"px-5 py-2.5 rounded-xl text-xs font-bold "+(likedIds.includes(selectedArticle.id)?'bg-red-600 text-white':'bg-stone-900 text-white')}>
                ♥ {likedIds.includes(selectedArticle.id) ? 'Disukai' : 'Suka'} ({formatViews(selStats.likes)})
              </button>
              <button onClick={()=>toggleBookmark(selectedArticle.id)} className="px-5 py-2.5 rounded-xl border text-xs font-bold">
                {bookmarks.includes(selectedArticle.id)?'🔖 Tersimpan':'🔖 Simpan'}
              </button>
              <button onClick={()=>shareArticle(selectedArticle)} className="px-5 py-2.5 rounded-xl border text-xs font-bold">
                ↗ Bagikan ({formatViews(selStats.shares)})
              </button>
            </div>

            {relatedArticles.length>0 && (
              <div className="mt-10 pt-6 border-t-2 border-stone-900">
                <h3 className="font-serif text-2xl font-black mb-4">Berita Terkait</h3>
                <div className="grid sm:grid-cols-3 gap-4">
                  {relatedArticles.map(a=>(
                    <button key={a.id} onClick={()=>openArticle(a)} className="text-left bg-white border border-stone-200 rounded-xl overflow-hidden group hover:border-stone-400">
                      <div className="h-28 overflow-hidden bg-stone-100">
                        <ArticleImg article={a} className="w-full h-full object-cover group-hover:scale-105 transition-transform" />
                      </div>
                      <div className="p-3">
                        <div className="text-[9px] font-black uppercase text-red-700">{a.category}</div>
                        <div className="font-serif font-black text-sm leading-tight mt-1 break-anywhere">{a.title}</div>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            )}

            <div className="mt-10 pt-6 border-t-2 border-stone-900">
              <h3 className="font-serif text-2xl font-black">Komentar ({selComments.length})</h3>
              <div className="mt-4 space-y-3">
                {selComments.length===0 && <p className="text-xs text-stone-500">Belum ada komentar. Jadilah yang pertama!</p>}
                {selComments.map(c=>(
                  <div key={c.id} className="bg-[#FDFBF7] border border-stone-200 rounded-xl p-3">
                    <div className="text-[10px] font-black text-stone-700">{c.name}</div>
                    <p className="text-sm mt-1 break-anywhere">{c.text}</p>
                  </div>
                ))}
              </div>
              <form onSubmit={e=>{e.preventDefault();addComment(selectedArticle.id,commentText);}} className="mt-4 flex gap-2">
                <input value={commentText} onChange={e=>setCommentText(e.target.value)} placeholder="Tulis komentar..."
                  className="flex-1 border border-stone-300 rounded-xl px-3 py-2.5 text-sm bg-white focus:outline-none focus:border-stone-500" />
                <button type="submit" className="px-5 py-2.5 rounded-xl bg-stone-900 text-white text-xs font-bold">Kirim</button>
              </form>
            </div>
          </div>
        </div>
      )}

      {/* KOTAK KODE RAHASIA */}
      {showSecretPrompt && (
        <div className="fixed inset-0 z-[200] bg-black/70 flex items-center justify-center p-4" onClick={()=>setShowSecretPrompt(false)}>
          <div className="bg-[#FDFBF7] rounded-2xl p-6 w-full max-w-xs shadow-2xl" onClick={e=>e.stopPropagation()}>
            <div className="text-[10px] uppercase tracking-widest font-black text-stone-400">🔒 Akses Terbatas</div>
            <h3 className="font-serif text-2xl font-black mt-1">Mode Redaksi</h3>
            <p className="text-xs text-stone-500 mt-1">Masukkan kode untuk membuka panel redaksi.</p>
            <form onSubmit={submitSecret} className="mt-4 space-y-3">
              <input type="password" autoFocus value={secretInput} onChange={e=>setSecretInput(e.target.value)}
                placeholder="Kode rahasia..." className="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm bg-white text-center tracking-widest focus:outline-none focus:border-stone-500" />
              <div className="flex gap-2">
                <button type="submit" className="flex-1 bg-stone-900 text-white rounded-xl py-2 text-xs font-black">Buka Panel</button>
                <button type="button" onClick={()=>setShowSecretPrompt(false)} className="px-4 rounded-xl border text-xs font-bold">Batal</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* PANEL REDAKSI */}
      {showAdmin && unlocked && (
        <div className="fixed inset-0 z-[130] bg-black/60 p-2 sm:p-6 flex items-start sm:items-center justify-center overflow-y-auto" onClick={()=>setShowAdmin(false)}>
          <div className="w-full max-w-3xl bg-[#FDFBF7] rounded-2xl sm:rounded-3xl shadow-2xl my-4" onClick={e=>e.stopPropagation()}>
            <div className="flex items-center justify-between p-4 border-b border-stone-200">
              <h3 className="font-serif text-xl sm:text-2xl font-black">
                Panel Redaksi 🔒
                {adminForm.id && <span className="ml-2 text-[9px] bg-amber-200 text-amber-800 px-2 py-1 rounded align-middle">MODE EDIT</span>}
              </h3>
              <button onClick={()=>setShowAdmin(false)} className="w-9 h-9 rounded-lg bg-stone-900 text-white text-lg leading-none">×</button>
            </div>

            <form onSubmit={e=>{e.preventDefault();saveArticle();}} className="p-4 sm:p-6 space-y-4">
              <label className="block">
                <span className="text-[10px] font-black uppercase tracking-widest text-stone-500">Judul Berita *</span>
                <input value={adminForm.title} onChange={e=>handleAdminInput('title',e.target.value)} placeholder="Tulis judul berita..."
                  className="mt-1 w-full border border-stone-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:border-stone-500" />
              </label>
              <div className="grid sm:grid-cols-2 gap-3">
                <label className="block">
                  <span className="text-[10px] font-black uppercase tracking-widest text-stone-500">Kategori</span>
                  <select value={adminForm.category} onChange={e=>handleAdminInput('category',e.target.value)} className="mt-1 w-full border border-stone-300 rounded-xl px-3 py-2 text-sm bg-white">
                    {ALL_CATEGORIES.filter(c=>c!=='Semua').map(c=><option key={c} value={c}>{c}</option>)}
                  </select>
                </label>
                <label className="block">
                  <span className="text-[10px] font-black uppercase tracking-widest text-stone-500">Provinsi</span>
                  <select value={adminForm.prov} onChange={e=>handleAdminInput('prov',e.target.value)} className="mt-1 w-full border border-stone-300 rounded-xl px-3 py-2 text-sm bg-white">
                    <option value="Nasional">Nasional</option>
                    {ALL_PROVINCES.map(p=><option key={p} value={p}>{p}</option>)}
                  </select>
                </label>
              </div>
              <div className="grid sm:grid-cols-2 gap-3">
                <label className="block">
                  <span className="text-[10px] font-black uppercase tracking-widest text-stone-500">Kota</span>
                  <input value={adminForm.kota} onChange={e=>handleAdminInput('kota',e.target.value)} placeholder="cth: Tangerang" className="mt-1 w-full border border-stone-300 rounded-xl px-3 py-2 text-sm bg-white" />
                </label>
                <label className="block">
                  <span className="text-[10px] font-black uppercase tracking-widest text-stone-500">Tag (pisahkan koma)</span>
                  <input value={adminForm.tags} onChange={e=>handleAdminInput('tags',e.target.value)} placeholder="Ekonomi, UMKM" className="mt-1 w-full border border-stone-300 rounded-xl px-3 py-2 text-sm bg-white" />
                </label>
              </div>
              <label className="block">
                <span className="text-[10px] font-black uppercase tracking-widest text-stone-500">Ringkasan (Deck)</span>
                <textarea value={adminForm.deck} onChange={e=>handleAdminInput('deck',e.target.value)} rows={2} placeholder="Ringkasan singkat..." className="mt-1 w-full border border-stone-300 rounded-xl px-3 py-2 text-sm bg-white" />
              </label>
              <label className="block">
                <span className="text-[10px] font-black uppercase tracking-widest text-stone-500">Isi Berita * (Enter 2x = paragraf baru, tampil lengkap)</span>
                <textarea value={adminForm.content} onChange={e=>handleAdminInput('content',e.target.value)} rows={10} placeholder="Tulis isi berita selengkap mungkin..." className="mt-1 w-full border border-stone-300 rounded-xl px-3 py-2 text-sm bg-white" />
              </label>
              <div>
                <span className="text-[10px] font-black uppercase tracking-widest text-stone-500">Foto — nama file di folder yang sama, URL internet, atau kosongkan</span>
                <input value={adminForm.image} onChange={e=>handleAdminInput('image',e.target.value)} placeholder="Hut desa 43.jpg" className="mt-1 w-full border border-stone-300 rounded-xl px-3 py-2 text-sm bg-white" />
              </div>
              <div className="flex flex-wrap items-center gap-4">
                <label className="flex items-center gap-2 text-xs font-bold">
                  <input type="checkbox" checked={adminForm.isBreaking} onChange={e=>handleAdminInput('isBreaking',e.target.checked)} className="w-4 h-4" />
                  Tandai BREAKING (masuk ticker)
                </label>
                <label className="flex items-center gap-2 text-xs font-bold">
                  <input type="checkbox" checked={adminForm.isLead} onChange={e=>handleAdminInput('isLead',e.target.checked)} className="w-4 h-4" />
                  Jadikan Berita Utama
                </label>
              </div>
              <div className="flex gap-2 pt-1">
                <button type="submit" className="flex-1 bg-stone-900 text-white rounded-xl py-2.5 text-xs font-black">{adminForm.id?'Simpan Perubahan':'Terbitkan Berita'}</button>
                <button type="button" onClick={resetAdmin} className="px-4 rounded-xl border text-xs font-bold">Kosongkan</button>
              </div>
            </form>

            <div className="border-t border-stone-200 p-4 sm:p-6">
              <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                <h4 className="font-serif text-lg font-black">Kelola Berita ({localArticles.length})</h4>
                <div className="flex gap-2">
                  <button onClick={resetAllData} className="text-[10px] px-2.5 py-1.5 rounded-lg border border-stone-300 font-bold hover:border-stone-500">⟲ Muat Ulang Data Awal</button>
                  <button onClick={exitAdminMode} className="text-[10px] px-2.5 py-1.5 rounded-lg bg-red-600 text-white font-bold">Keluar Mode Redaksi</button>
                </div>
              </div>
              <div className="max-h-56 overflow-y-auto space-y-2">
                {localArticles.map(a=>(
                  <div key={a.id} className="flex items-center gap-2 bg-white rounded-xl border border-stone-200 p-2">
                    <div className="w-12 h-9 rounded-lg overflow-hidden shrink-0 bg-stone-100">
                      <ArticleImg article={a} className="w-full h-full object-cover" />
                    </div>
                    <div className="flex-1 min-w-0 text-xs font-bold truncate">{a.title}</div>
                    <button onClick={()=>editArticle(a)} className="text-[10px] px-2.5 py-1 rounded-lg bg-stone-900 text-white font-bold shrink-0">Edit</button>
                    <button onClick={()=>deleteArticle(a.id)} className="text-[10px] px-2.5 py-1 rounded-lg border border-stone-300 font-bold shrink-0">Hapus</button>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* NOTIFIKASI */}
      {showNotifications && (
        <div className="fixed inset-0 z-[120] bg-black/60 flex justify-end" onClick={()=>setShowNotifications(false)}>
          <aside className="w-full max-w-sm h-full bg-[#FDFBF7] shadow-2xl flex flex-col" onClick={e=>e.stopPropagation()}>
            <div className="flex items-center justify-between p-4 border-b border-stone-200">
              <h3 className="font-serif text-xl font-black">Notifikasi</h3>
              <div className="flex gap-2">
                <button onClick={clearNotifications} className="text-[10px] px-2.5 py-1.5 border border-stone-300 rounded-lg font-bold">Bersihkan</button>
                <button onClick={()=>setShowNotifications(false)} className="w-8 h-8 rounded-lg bg-stone-900 text-white text-lg leading-none">×</button>
              </div>
            </div>
            <div className="flex-1 overflow-y-auto p-4 space-y-3">
              {notifications.length===0 && <p className="text-xs text-stone-500">Belum ada notifikasi.</p>}
              {notifications.map(n=>(
                <div key={n.id} className={"p-3 rounded-xl border "+(n.read?'border-stone-200 bg-white':'border-red-200 bg-red-50')}>
                  <div className="text-[9px] font-black uppercase text-red-700">{n.title}</div>
                  <div className="text-sm font-bold mt-1 break-anywhere">{n.text}</div>
                </div>
              ))}
            </div>
          </aside>
        </div>
      )}

      {/* BOOKMARK */}
      {showBookmarks && (
        <div className="fixed inset-0 z-[120] bg-black/60 flex justify-end" onClick={()=>setShowBookmarks(false)}>
          <aside className="w-full max-w-sm h-full bg-[#FDFBF7] shadow-2xl flex flex-col" onClick={e=>e.stopPropagation()}>
            <div className="flex items-center justify-between p-4 border-b border-stone-200">
              <h3 className="font-serif text-xl font-black">Bookmark ({bookmarkedArticles.length})</h3>
              <button onClick={()=>setShowBookmarks(false)} className="w-8 h-8 rounded-lg bg-stone-900 text-white text-lg leading-none">×</button>
            </div>
            <div className="flex-1 overflow-y-auto p-4 space-y-3">
              {bookmarkedArticles.length===0 && <p className="text-xs text-stone-500">Belum ada berita tersimpan.</p>}
              {bookmarkedArticles.map(a=>(
                <div key={a.id} className="flex gap-3 bg-white border border-stone-200 rounded-xl p-2.5">
                  <div className="w-16 h-12 rounded-lg overflow-hidden shrink-0 bg-stone-100">
                    <ArticleImg article={a} className="w-full h-full object-cover" />
                  </div>
                  <button onClick={()=>{setShowBookmarks(false);openArticle(a);}} className="flex-1 min-w-0 text-left">
                    <div className="text-[9px] font-black uppercase text-red-700">{a.category}</div>
                    <div className="font-serif font-black text-sm leading-tight break-anywhere">{a.title}</div>
                  </button>
                  <button onClick={()=>toggleBookmark(a.id)} className="text-xs px-2 self-start text-stone-400 hover:text-red-600">✕</button>
                </div>
              ))}
            </div>
          </aside>
        </div>
      )}

      {/* TOAST */}
      {toast && (
        <div className="fixed bottom-4 right-4 z-[300] toast-in">
          <button onClick={clickToast} className="bg-stone-900 text-white rounded-2xl shadow-2xl p-4 max-w-xs text-left border border-stone-700">
            <div className="text-[9px] uppercase tracking-widest font-black text-red-400 mb-1 flex items-center gap-1.5">
              <span className="w-1.5 h-1.5 rounded-full bg-red-500 live-dot"></span> Berita Baru Masuk
            </div>
            <div className="font-serif font-black leading-tight text-sm break-anywhere">{toast.title}</div>
            <div className="text-[10px] text-stone-400 mt-1">klik untuk baca →</div>
          </button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Boundary><App /></Boundary>);
</script>
